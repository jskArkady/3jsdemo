  <style>
@layer demo {
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #b5d4e3;
      user-select: none;
    }
    #stage {
      position: fixed;
      inset: 0;
      background: #b5d4e3;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #fps-stats {
      position: fixed;
      top: 15px;
      right: 15px;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 4px;
      color: #00ff66;
      font-family: monospace;
      font-size: 11px;
      pointer-events: none;
      z-index: 99999;
      line-height: 1.2;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; --accent: #d9c59a; }
    .scene-header { position: fixed; top: 28px; left: 32px; color: #edf0ee; pointer-events: none; max-width: min(560px, calc(100vw - 64px)); text-shadow: 0 2px 10px #000; }
    .scene-header { isolation: isolate; }
    .scene-header::before { content: ""; position: absolute; inset: -10px -12px; z-index: -1; border-radius: 8px; background: linear-gradient(110deg, #0b1922df, #0b19228c); }
    .scene-header a { display: inline-block; margin-bottom: 22px; pointer-events: auto; color: var(--accent); text-decoration: none; font-size: 12px; }
    .eyebrow { font: 10px/1.8 ui-monospace, monospace; letter-spacing: .2em; color: var(--accent); }
    h1 { margin: 8px 0; font-size: clamp(23px, 3vw, 36px); font-weight: 450; letter-spacing: -.04em; }
    .scene-header p { margin: 0; font-size: 12px; line-height: 1.8; color: #d0dadb; }
    #fps-stats { top: 28px; right: 28px; color: #b8cecd; background: #101b22d9; font: 10px/1.8 ui-monospace, monospace; max-width: calc(100vw - 32px); z-index: 1; }
    .scene-footer { position: fixed; bottom: 24px; left: 32px; right: 32px; display: flex; justify-content: flex-end; pointer-events: none; }
    .controls { pointer-events: auto; padding: 14px 16px; border: 1px solid #a7bbbd44; background: #101b22e8; border-radius: 8px; backdrop-filter: blur(14px); color: #dfebe9; max-width: 100%; }
    .control-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    button, select { font: 12px system-ui; padding: 9px 12px; min-height: 38px; border: 1px solid #647d8266; border-radius: 4px; background: #1b2b33; color: #dfebe9; cursor: pointer; }
    button:hover, select:hover { border-color: var(--accent); }
    button[aria-pressed="true"] { background: #345052; border-color: var(--accent); }
    label { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #bccdcc; }
    input { width: 85px; accent-color: var(--accent); }
    output { min-width: 28px; font: 11px ui-monospace, monospace; }
    a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    #scene-status { margin: 10px 0 0; color: #b4c7c6; font-size: 11px; line-height: 1.6; }
    @media (max-width: 650px) {
      .scene-header { top: 18px; left: 20px; max-width: calc(100vw - 40px); }
      .scene-header a { margin-bottom: 36px; }
      .scene-header p { font-size: 11px; max-width: 290px; }
      #fps-stats { top: 48px; left: 20px; right: auto; font-size: 9px; padding: 4px 7px; }
      .scene-footer { left: 12px; right: 12px; bottom: 12px; }
      .controls { width: 100%; padding: 12px; }
      .control-row { gap: 8px; }
      button, select { padding: 8px; font-size: 11px; }
    }
    @media (max-height: 500px) {
      .scene-header { top: 10px; left: 18px; }
      .scene-header a { margin-bottom: 4px; }
      h1 { font-size: 21px; }
      .eyebrow, .scene-header p { display: none; }
      #fps-stats { top: 12px; left: auto; right: 12px; }
      .scene-footer { bottom: 10px; }
      .controls { padding: 9px; }
    }
  }
</style>
<link rel="stylesheet" href="../shared/demo-ui.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.183.0/build/three.module.js",

<body class="demo-ui demo-scene">
  <div id="stage"></div>
  <div id="fps-stats" aria-label="프레임 속도">FPS · 측정 준비 중</div>
  <header class="scene-header">
    <a href="../index.html">← 데모 갤러리</a>
    <div class="eyebrow">THREE.JS / CINEMATIC EXPLORATION</div>
    <h1>Ancient Cliff Sanctuary</h1>
    <p>협곡의 순례길과 고대 성소, 거대한 수호자의 느린 발걸음.</p>
  </header>
  <footer class="scene-footer">
    <section class="controls" aria-label="장면 조작">
      <div class="control-row">
        <button id="pause" type="button" aria-pressed="false">일시정지</button>
        <label for="speed">배속 <select id="speed"><option value="0.25">0.25×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
        <button id="auto" type="button" aria-pressed="true">자동 카메라 켜짐</button>
        <label for="exposure">노출 <input id="exposure" type="range" min="0.5" max="1.8" step="0.01" value="1.08"><output id="exposure-value" for="exposure">1.08</output></label>
      </div>
      <p id="scene-status" role="status" aria-live="polite"></p>
    </section>
  </footer>


  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { SSAOPass } from "three/addons/postprocessing/SSAOPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
    import { FXAAShader } from "three/addons/shaders/FXAAShader.js";

    const container = document.getElementById("stage");

    // Renderer Setup
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance",
      precision: "highp",
      alpha: false,
      stencil: false,
      depth: true,
      logarithmicDepthBuffer: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.0));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xaec3d0);
    scene.fog = new THREE.FogExp2(0x94b1c1, 0.0045);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 400);

    const clock = new THREE.Clock();
    const cameraTarget = new THREE.Vector3(16, 17, -60);
    const cameraTargetLag = new THREE.Vector3(16, 17, -60);
    const dummy = new THREE.Object3D();
    let animationId = 0;

    // COMMON CAMERA + FPS PASS

    // FPS Telemetry State
    let fpsWarmupEnd = performance.now() + 1000;
    let fpsMin = Infinity;
    let fpsMax = -Infinity;
    let fpsAvg = 0;
    let fpsAccumulatedFrames = 0;
    let fpsAccumulatedTime = 0;
    let lastFpsUpdateTime = 0;
    let lastFrameTime = 0;

    function fpsResetState() {
      fpsWarmupEnd = performance.now() + 1000;
      fpsMin = Infinity;
      fpsMax = -Infinity;
      fpsAvg = 0;
      fpsAccumulatedFrames = 0;
      fpsAccumulatedTime = 0;
      lastFpsUpdateTime = performance.now();
    }

    function formatFps(value) { return value < 10 ? value.toFixed(1) : String(Math.round(value)); }

    function onVisibilityChange() {
      if (document.visibilityState === "visible") {
        fpsResetState();
        clock.getDelta();
      }
    }
    document.addEventListener("visibilitychange", onVisibilityChange);

    // Reduced Motion Awareness
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const speedMultiplier = prefersReducedMotion ? 0.05 : 1.0;

    let paused = false;
    let playbackSpeed = 1;
    let autoCamera = !prefersReducedMotion;
    let simulationTime = 0;
    let cameraTime = 0;
    let cameraInitialized = false;
    const uiEvents = new AbortController();
    const pauseButton = document.getElementById("pause");
    const autoButton = document.getElementById("auto");
    function syncControls() {
      pauseButton.textContent = paused ? "재생" : "일시정지";
      pauseButton.setAttribute("aria-pressed", String(paused));
      autoButton.textContent = autoCamera ? "자동 카메라 켜짐" : "자동 카메라 꺼짐";
      autoButton.setAttribute("aria-pressed", String(autoCamera));
      document.getElementById("scene-status").textContent =
        `${paused ? "일시정지" : "재생 중"} · ${playbackSpeed}× · ${autoCamera ? "자동 카메라" : "카메라 고정"}${prefersReducedMotion ? " · 동작 줄이기 적용" : ""}`;
    }
    pauseButton.addEventListener("click", () => { paused = !paused; syncControls(); }, { signal: uiEvents.signal });
    autoButton.addEventListener("click", () => { autoCamera = !autoCamera; syncControls(); }, { signal: uiEvents.signal });
    document.getElementById("speed").addEventListener("change", (event) => {
      playbackSpeed = Number(event.target.value); syncControls();
    }, { signal: uiEvents.signal });
    document.getElementById("exposure").addEventListener("input", (event) => {
      renderer.toneMappingExposure = Number(event.target.value);
      document.getElementById("exposure-value").value = renderer.toneMappingExposure.toFixed(2);
    }, { signal: uiEvents.signal });
    syncControls();


    // Procedural Noise and Texture Generation
    function hash2(x, y) {
      return THREE.MathUtils.euclideanModulo(Math.sin(x * 127.1 + y * 311.7) * 43758.5453123, 1);
    }

    function valueNoise(x, y) {
      const ix = Math.floor(x);
      const iy = Math.floor(y);
      const fx = x - ix;
      const fy = y - iy;
      const ux = fx * fx * (3 - 2 * fx);
      const uy = fy * fy * (3 - 2 * fy);
      const a = hash2(ix, iy);
      const b = hash2(ix + 1, iy);
      const c = hash2(ix, iy + 1);
      const d = hash2(ix + 1, iy + 1);
      return THREE.MathUtils.lerp(THREE.MathUtils.lerp(a, b, ux), THREE.MathUtils.lerp(c, d, ux), uy);
    }

    function fbm(x, y, octaves = 3) {
      let value = 0.0;
      let amplitude = 0.5;
      let frequency = 1.0;
      for (let i = 0; i < octaves; i++) {
        value += amplitude * valueNoise(x * frequency, y * frequency);
        frequency *= 2.0;
        amplitude *= 0.5;
      }
      return value;
    }

    // Independent albedo, relief and roughness maps: pigment is never used as height.
    // Four-way noise blending makes the weathering tile continuously in both axes.
    function createWeatheredSurface(vegetation = false) {
      const size = 512;
      const canvases = Array.from({ length: 3 }, () => {
        const c = document.createElement("canvas"); c.width = c.height = size; return c;
      });
      const contexts = canvases.map(c => c.getContext("2d"));
      const images = contexts.map(c => c.createImageData(size, size));
      function tileNoise(u, v, scale) {
        const x = u * scale, y = v * scale;
        return THREE.MathUtils.lerp(
          THREE.MathUtils.lerp(fbm(x, y, 3), fbm(x - scale, y, 3), u),
          THREE.MathUtils.lerp(fbm(x, y - scale, 3), fbm(x - scale, y - scale, 3), u), v);
      }
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        const u = x / size, v = y / size;
        const broad = tileNoise(u, v, 6), grain = tileNoise(u, v, 46);
        const strata = Math.sin(v * Math.PI * 32 + Math.sin(u * Math.PI * 4) * 1.8);
        const fissure = Math.pow(Math.max(0, strata), 22) * (0.3 + broad);
        const pits = Math.max(0, 0.30 - grain) * 2.8;
        const damp = THREE.MathUtils.smoothstep(broad, 0.47, 0.65);
        const shade = 0.7 + grain * 0.50 - fissure * 0.13 - damp * 0.13;
        const base = vegetation ? [104, 119, 70] : [188, 180, 157];
        const i = (x + y * size) * 4;
        for (let channel = 0; channel < 3; channel++) {
          images[0].data[i + channel] = base[channel] * shade + (channel === 1 ? damp * 7 : 0);
          images[1].data[i + channel] = 140 + grain * 72 - fissure * 75 - pits * 40;
          images[2].data[i + channel] = 222 + grain * 28 - damp * 42;
        }
        images.forEach(image => { image.data[i + 3] = 255; });
      }
      return canvases.map((canvas, i) => {
        contexts[i].putImageData(images[i], 0, 0);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = i === 0 ? THREE.SRGBColorSpace : THREE.NoColorSpace;
        texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.setScalar(vegetation ? 6 : 4);
        texture.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);
        return texture;
      });
    }
    const [stoneTexture, stoneHeight, stoneRoughness] = createWeatheredSurface();
    const [grassTexture, grassHeight, grassRoughness] = createWeatheredSurface(true);

    // GRAPHICS ENHANCEMENT LOOP 1: LIGHTING + MATERIALS

    // Materials
    const stoneMaterial = new THREE.MeshStandardMaterial({
      map: stoneTexture,
      bumpMap: stoneHeight,
      bumpScale: 0.19,
      roughnessMap: stoneRoughness,
      roughness: 0.9,
      metalness: 0.05
    });

    // World-scale projection keeps mineral grain and relief consistent across tall
    // cliff blocks and thin ledges, including differently scaled instances.
    const cliffMaterial = stoneMaterial.clone();
    cliffMaterial.bumpScale = 0.15;
    cliffMaterial.onBeforeCompile = shader => {
      shader.vertexShader = `varying vec3 vCliffPosition;
        varying vec3 vCliffNormal;
` + shader.vertexShader;
      shader.vertexShader = shader.vertexShader.replace("#include <project_vertex>", `
        #include <project_vertex>
        vec4 cliffWorld = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          cliffWorld = instanceMatrix * cliffWorld;
        #endif
        vCliffPosition = (modelMatrix * cliffWorld).xyz;
        vCliffNormal = inverseTransformDirection(transformedNormal, viewMatrix);
      `);
      shader.fragmentShader = `
        varying vec3 vCliffPosition;
        varying vec3 vCliffNormal;
        vec4 cliffSample(sampler2D sourceMap, vec3 worldPosition) {
          vec3 weights = pow(abs(normalize(vCliffNormal)), vec3(4.0));
          weights /= max(dot(weights, vec3(1.0)), 0.0001);
          vec3 p = worldPosition * 0.125;
          return texture2D(sourceMap, p.zy) * weights.x
               + texture2D(sourceMap, p.xz) * weights.y
               + texture2D(sourceMap, p.xy) * weights.z;
        }
      ` + shader.fragmentShader;
      shader.fragmentShader = shader.fragmentShader.replace("#include <map_fragment>",
        THREE.ShaderChunk.map_fragment.replace("texture2D( map, vMapUv )", "cliffSample(map, vCliffPosition)"));
      shader.fragmentShader = shader.fragmentShader.replace("#include <roughnessmap_fragment>",
        THREE.ShaderChunk.roughnessmap_fragment.replace("texture2D( roughnessMap, vRoughnessMapUv )", "cliffSample(roughnessMap, vCliffPosition)"));
      // Preserve Three's surface-gradient normal perturbation; only its height
      // samples change to the same world-space projection used by albedo.
      const bumpChunk = THREE.ShaderChunk.bumpmap_pars_fragment.replace(
        /vec2 dHdxy_fwd\(\) \{[\s\S]*?\n\t\}/,
        `vec2 dHdxy_fwd() {
          float centerHeight = cliffSample(bumpMap, vCliffPosition).x;
          float dx = cliffSample(bumpMap, vCliffPosition + dFdx(vCliffPosition)).x - centerHeight;
          float dy = cliffSample(bumpMap, vCliffPosition + dFdy(vCliffPosition)).x - centerHeight;
          return bumpScale * vec2(dx, dy);
        }`);
      shader.fragmentShader = shader.fragmentShader.replace("#include <bumpmap_pars_fragment>", bumpChunk);
    };
    cliffMaterial.customProgramCacheKey = () => "cliff-world-triplanar-v1";

    const mountainMaterial = new THREE.MeshStandardMaterial({
      map: stoneTexture,
      color: 0x8fa3b3,
      bumpMap: stoneHeight,
      bumpScale: 0.03,
      roughnessMap: stoneRoughness,
      roughness: 0.95,
      metalness: 0.0
    });

    const bridgeStoneMaterial = new THREE.MeshStandardMaterial({
      map: stoneTexture,
      bumpMap: stoneHeight,
      bumpScale: 0.12,
      roughnessMap: stoneRoughness,
      roughness: 0.82,
      metalness: 0.08
    });

    const colossusArmorMaterial = new THREE.MeshStandardMaterial({
      map: stoneTexture,
      color: 0x817d6d,
      bumpMap: stoneHeight,
      bumpScale: 0.025,
      roughnessMap: stoneRoughness,
      roughness: 0.94,
      metalness: 0.08
    });

    const grassTerrainMaterial = new THREE.MeshStandardMaterial({
      map: grassTexture,
      bumpMap: grassHeight,
      bumpScale: 0.01,
      roughnessMap: grassRoughness,
      roughness: 0.95,
      metalness: 0.0
    });

    const grassMaterial = new THREE.MeshStandardMaterial({
      map: grassTexture,
      roughness: 0.95,
      side: THREE.DoubleSide
    });

    // Custom shader modifiers for grass wind
    grassMaterial.onBeforeCompile = (shader) => {
      shader.uniforms.time = { value: 0 };
      shader.vertexShader = `
        uniform float time;
      ` + shader.vertexShader;
      shader.vertexShader = shader.vertexShader.replace(
        "#include <begin_vertex>",
        `
          #include <begin_vertex>
          float windTime = time * 2.0;
          float wave = sin(windTime + position.x * 0.8 + position.z * 0.8) * 0.16;
          wave += cos(windTime * 1.5 + position.x * 1.2 - position.z * 0.9) * 0.06;
          float h = position.y;
          transformed.x += wave * h * h;
          transformed.z += wave * 0.5 * h * h;
        `
      );
      grassMaterial.userData.shader = shader;
    };

    // Lights
    const ambientLight = new THREE.HemisphereLight(0xa6cde8, 0x34372e, 0.92);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffd6a0, 3.15);
    dirLight.position.set(-45, 66, 38);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.bias = -0.00015;
    dirLight.shadow.normalBias = 0.12;
    dirLight.shadow.radius = 14;
    dirLight.shadow.blurSamples = 32;
    dirLight.shadow.camera.near = 15;
    dirLight.shadow.camera.far = 300;
    
    const d = 110;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x8eb6d2, 0.42);
    fillLight.position.set(25, 25, -110);
    scene.add(fillLight);

    // Soft, independently controlled strata replace opaque flat haze slabs.
    const mistCanvas = document.createElement("canvas");
    mistCanvas.width = mistCanvas.height = 256;
    const mistContext = mistCanvas.getContext("2d");
    const mistImage = mistContext.createImageData(256, 256);
    for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
      const nx = (x - 128) / 128, ny = (y - 128) / 128;
      const edge = Math.max(0, 1 - nx * nx - ny * ny);
      const i = (x + y * 256) * 4;
      mistImage.data[i] = mistImage.data[i + 1] = mistImage.data[i + 2] = 255;
      mistImage.data[i + 3] = Math.pow(edge, 1.8) * (0.45 + fbm(x * 0.025, y * 0.025, 3)) * 220;
    }
    mistContext.putImageData(mistImage, 0, 0);
    const mistTexture = new THREE.CanvasTexture(mistCanvas);
    mistTexture.colorSpace = THREE.SRGBColorSpace;
    const mistLayers = [];
    for (let i = 0; i < 6; i++) {
      const layer = new THREE.Mesh(new THREE.PlaneGeometry(205, 120), new THREE.MeshBasicMaterial({
        map: mistTexture, color: i < 3 ? 0x94b6c6 : 0xb9cdd4,
        transparent: true, opacity: i < 3 ? 0.38 : 0.14, depthWrite: false, side: THREE.DoubleSide
      }));
      layer.rotation.x = -Math.PI / 2 + (i > 2 ? 0.34 : 0);
      layer.position.set(0, -38 + i * 8, -70 - i * 12);
      layer.userData.baseX = layer.position.x;
      scene.add(layer); mistLayers.push(layer);
    }

    // Deep Canyon Floor (fallback visual ground)
    const canyonFloorGeo = new THREE.PlaneGeometry(500, 500);
    canyonFloorGeo.rotateX(-Math.PI / 2);
    const canyonFloorMat = new THREE.MeshStandardMaterial({
      color: 0x768f9e,
      roughness: 0.95,
      metalness: 0.1
    });
    const canyonFloor = new THREE.Mesh(canyonFloorGeo, canyonFloorMat);
    canyonFloor.position.y = -65;
    canyonFloor.receiveShadow = true;
    scene.add(canyonFloor);

    // Foreground Grass Cliff
    function getTerrainHeight(x, z) {
      let y = valueNoise(x * 0.05, z * 0.05) * 7.5 - 2.5;
      if (z < -10) {
        y += (z + 10) * 0.8;
      }
      if (x < -22) {
        y += (x + 22) * 1.4;
      }
      if (x > 18) {
        y -= (x - 18) * 1.4;
      }
      return y;
    }

    const foregroundGeo = new THREE.PlaneGeometry(60, 60, 128, 128);
    foregroundGeo.rotateX(-Math.PI / 2);
    const pos = foregroundGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const px = pos.getX(i);
      const pz = pos.getZ(i);
      pos.setY(i, getTerrainHeight(px, pz));
    }
    foregroundGeo.computeVertexNormals();

    const foregroundTerrain = new THREE.Mesh(foregroundGeo, grassTerrainMaterial);
    foregroundTerrain.position.set(-10, 0, 15);
    foregroundTerrain.receiveShadow = true;
    foregroundTerrain.castShadow = true;
    scene.add(foregroundTerrain);

    // Sculpted closed surfaces: continuous coordinate noise keeps UV seams together.
    function organicGeometry(width, height, depth, fullness = 0.85, erosion = 0.045) {
      const geometry = new THREE.SphereGeometry(1, 32, 20);
      const positions = geometry.attributes.position;
      const shape = value => Math.sign(value) * Math.pow(Math.abs(value), fullness);
      for (let i = 0; i < positions.count; i++) {

        positions.setXYZ(i, shape(x) * width * 0.5 * relief,
          shape(y) * height * 0.5 * relief, shape(z) * depth * 0.5 * relief);
      }
      geometry.computeVertexNormals();
      return geometry;

        const swell = 1 + Math.sin(t * Math.PI) * bulge;

      const chord = 0.42 * Math.pow(1 - t, 0.65) + 0.025;
      return [side * span, Math.sin(t * Math.PI * 0.85) * 0.18,

    // Fine waterfall ribbons: longitudinal turbulent flow and tapered spray,

    // GRAPHICS ENHANCEMENT LOOP 3: ATMOSPHERE + FINAL GRADE
    // Color Grading Custom Post-Processing Pass
    const GradeShader = {
      uniforms: {
        tDiffuse: { value: null },
        time: { value: 0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float time;
        varying vec2 vUv;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }

        void main() {
          vec2 uv = vUv;
          vec2 center = vec2(0.5);
          float dist = length(uv - center);
          
          // Enhanced barrel distortion
          vec2 uvDist = uv - center;
          float barrelStrength = 0.045;
          float r2 = dot(uvDist, uvDist);
          uv = center + uvDist * (1.0 + barrelStrength * r2);
          
          // Enhanced Chromatic Aberration (quadratic falloff)
          float caStrength = dist * dist * 0.0014;
          float r = texture2D(tDiffuse, uv - vec2(caStrength, 0.0)).r;
          float g = texture2D(tDiffuse, uv).g;
          float b = texture2D(tDiffuse, uv + vec2(caStrength, 0.0)).b;
          vec3 color = vec3(r, g, b);
          
          // Shadows lift / highlights compress (S-curve contrast)
          color = mix(vec3(0.5), color, 1.12);
          color = max(vec3(0.0), color);
          
          float luma = dot(color, vec3(0.299, 0.587, 0.114));
          
          // Cool shadows, warm midtones, bright highlights
          vec3 shadow_tint = vec3(0.82, 0.90, 1.08);
          vec3 mid_tint = vec3(1.02, 1.00, 0.985);
          vec3 hi_tint = vec3(1.07, 1.035, 0.975);
          vec3 tinted = mix(shadow_tint, mid_tint, smoothstep(0.0, 0.5, luma));
          tinted = mix(tinted, hi_tint, smoothstep(0.5, 1.0, luma));
          color *= tinted;
          
          // Subtle desaturation for ancient/weathered look
          color = mix(vec3(luma), color, 0.90);
          
          // High-quality temporal film grain
          float grain = hash(uv * vec2(1920.0, 1080.0) + vec2(time * 13.5, time * 7.3)) - 0.5;
          float grain2 = hash(uv * vec2(1920.0, 1080.0) * 0.5 + vec2(time * 9.1, time * 4.7)) - 0.5;
          color += (grain * 0.65 + grain2 * 0.35) * 0.008;
          
          // Multi-layer vignette (strong)
          float v1 = uv.x * uv.y * (1.0 - uv.x) * (1.0 - uv.y);
          float vignette = clamp(pow(max(0.0, 16.0 * v1), 0.22), 0.0, 1.0);
          float vignette2 = clamp(pow(max(0.0, 9.0 * v1), 0.45), 0.0, 1.0);
          color *= mix(0.72, 1.0, vignette * 0.6 + vignette2 * 0.4);
          
          gl_FragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
        }
      `
    };

    // Post-Processing Composer Setup
    let composer, ssaoPass, gradePass;
    try {
      composer = new EffectComposer(renderer);
      const renderPass = new RenderPass(scene, camera);

      ssaoPass = new SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
      ssaoPass.kernelRadius = 16;
      ssaoPass.minDistance = 0.005;
      ssaoPass.maxDistance = 0.15;
      // SSAOPass r183 replaces every mesh material with an opaque normal material.
      // Keep soft mist, water and cutout leaves out of that depth pass; the preceding
      // RenderPass still draws them normally into the beauty image.
      const aoExcluded = [];
      scene.traverse((object) => {
        if (!object.isMesh) return;
        const materials = Array.isArray(object.material) ? object.material : [object.material];
        if (materials.some(material => material.transparent || material.alphaTest > 0)) {
          aoExcluded.push(object);
        }
      });
      const renderAO = ssaoPass.render.bind(ssaoPass);
      ssaoPass.render = (...args) => {
        const visibility = aoExcluded.map(object => object.visible);
        aoExcluded.forEach(object => { object.visible = false; });
        try {
          renderAO(...args);
        } finally {
          aoExcluded.forEach((object, index) => { object.visible = visibility[index]; });
        }
      };

        new THREE.Vector2(window.innerWidth, window.innerHeight),

    // Four-beat walk: three feet support the weight while one recovers.
    // Contact points are sampled from absolute time, so planted feet do not slide
    // and the gait remains identical at different frame rates or after a pause.
    // Include the claws in the sole offset so the lowest visible vertex meets the rock.
    colossusGroup.updateMatrixWorld(true);
    const footSoleOffset = footFL.getWorldPosition(new THREE.Vector3()).y
      - new THREE.Box3().setFromObject(footFL, true).min.y;
    const gaitPeriod = 5.6;
    const stanceFraction = 0.76;
    const gaitLegs = [
      { pivot: pivotFL, mesh: legFL, foot: footFL, phase: 0.5 },
      { pivot: pivotFR, mesh: legFR, foot: footFR, phase: 0 },
      { pivot: pivotBL, mesh: legBL, foot: footBL, phase: 0.75 },
      { pivot: pivotBR, mesh: legBR, foot: footBR, phase: 0.25 }
    ];
    for (const leg of gaitLegs) {
      leg.foot.traverse(object => { if (object.isMesh) object.castShadow = object.receiveShadow = true; });
      leg.rest = new Float32Array(leg.mesh.geometry.attributes.position.array);
      leg.mesh.geometry.attributes.position.setUsage(THREE.DynamicDrawUsage);
      // The limb deforms beyond its rest bounds; only these four meshes skip culling.
      leg.mesh.frustumCulled = false;
    }
    const gaitContact = new THREE.Vector3();
    const gaitNextContact = new THREE.Vector3();
    const gaitAnkle = new THREE.Vector3();
    const gaitWorldRotation = new THREE.Quaternion();
    const gaitFootRotation = new THREE.Quaternion();
    const gaitUp = new THREE.Vector3(0, 1, 0);
    const gaitRoutePosition = new THREE.Vector3();
    const smoothStep5 = t => t * t * t * (t * (t * 6 - 15) + 10);

    function sampleColossusRoute(time, position) {
      // A broad oval replaces the abrupt end-of-path reversal.
      const angle = time * (0.7 / 27) - Math.asin(10 / 27);
      const x = -8 + 27 * Math.sin(angle);
      position.set(x, guardianGroundY + footSoleOffset + 12.8, -119 + 9 * Math.cos(angle));
      return Math.atan2(27 * Math.cos(angle), -9 * Math.sin(angle));
    }

    function sampleFootContact(time, leg, result) {
      // Place the foot ahead at touchdown; the body travels over it during stance.
      const yaw = sampleColossusRoute(time + gaitPeriod * stanceFraction * 0.5, result);
      const x = leg.pivot.position.x, z = leg.pivot.position.z;
      result.x += Math.cos(yaw) * x + Math.sin(yaw) * z;
      result.z += -Math.sin(yaw) * x + Math.cos(yaw) * z;
      result.y = guardianGroundY + footSoleOffset;
      return yaw;
    }

    function updateColossus(time) {
      const yaw = sampleColossusRoute(time, gaitRoutePosition);
      colossusGroup.position.copy(gaitRoutePosition);
      colossusGroup.rotation.y = yaw;
      const cycle = time / gaitPeriod * Math.PI * 2;
      colossusBody.position.y = -0.08 + Math.cos(cycle * 4) * 0.055;
      colossusBody.rotation.set(Math.sin(cycle * 2 - 0.4) * 0.012, 0,
        Math.sin(cycle - 0.5) * 0.023);
      colossusGroup.updateMatrixWorld(true);

      for (const leg of gaitLegs) {
        const cycles = time / gaitPeriod + leg.phase;
        const phase = cycles - Math.floor(cycles);
        const contactTime = (Math.floor(cycles) - leg.phase) * gaitPeriod;
        const contactYaw = sampleFootContact(contactTime, leg, gaitContact);
        const nextYaw = sampleFootContact(contactTime + gaitPeriod, leg, gaitNextContact);
        const swing = phase < stanceFraction ? 0 : (phase - stanceFraction) / (1 - stanceFraction);
        const blend = smoothStep5(swing);
        // Zero vertical velocity on both lift-off and touchdown.
        const lift = Math.pow(Math.sin(swing * Math.PI), 2) * 0.85;
        gaitAnkle.copy(gaitContact).lerp(gaitNextContact, blend);
        gaitAnkle.y += lift;
        leg.pivot.worldToLocal(gaitAnkle);
        leg.foot.position.copy(gaitAnkle);
        const yawDelta = Math.atan2(Math.sin(nextYaw - contactYaw), Math.cos(nextYaw - contactYaw));
        gaitFootRotation.setFromAxisAngle(gaitUp, contactYaw + yawDelta * blend);
        leg.pivot.getWorldQuaternion(gaitWorldRotation);
        leg.foot.quaternion.copy(gaitWorldRotation.invert()).multiply(gaitFootRotation);

        // Continuous skin bends through the knee instead of swinging as a rigid rod.
        const positions = leg.mesh.geometry.attributes.position;
        for (let i = 0; i < positions.count; i++) {
          const offset = i * 3;
          const t = THREE.MathUtils.clamp(-leg.rest[offset + 1] / 11, 0, 1);
          positions.setXYZ(i,
            leg.rest[offset] + gaitAnkle.x * t,
            leg.rest[offset + 1] * (-gaitAnkle.y / 11),
            leg.rest[offset + 2] + gaitAnkle.z * t + Math.sin(t * Math.PI) * lift * 0.7);
        }
        positions.needsUpdate = true;
        leg.mesh.geometry.computeVertexNormals();
      }
      // Delayed, low-amplitude head motion counters the body's weight shift.
      neckMesh.rotation.set(Math.sin(cycle * 2 - 0.9) * 0.025,
        Math.sin(time * 0.17) * 0.07, -colossusBody.rotation.z * 0.4);
      headMesh.rotation.x = -0.055 + Math.sin(cycle * 2 - 1.4) * 0.025;
    }

    function updateBirds(time) {
      for (let i = 0; i < birdCount; i++) {
        const state = birdState[i];
        const angle = time * state.speed + state.phase;
        const bx = 42 + Math.cos(angle) * state.radius;
        const bz = bridgeZ + Math.sin(angle) * state.radius;
        const by = 26 + state.heightOffset + Math.sin(time * 0.85 + state.phase) * 3;

        dummy.position.set(bx, by, bz);
        const heading = -angle + Math.PI / 2 + state.yawOffset;
        dummy.rotation.set(
          Math.sin(time * 2.2 + state.phase) * 0.06,

        dummy.scale.setScalar(state.scale);

    function updateParticles(delta, time) {

      for (let i = 0; i < particleCount; i++) {
        const idx = i * 3;

        array[idx + 1] += Math.sin(time * 0.45 + i) * delta * 0.45;

          array[idx + 1] = -12 + Math.random() * 42;
          array[idx + 2] = -95 + Math.random() * 125;

      for (let i = 0; i < moteCount; i++) {
        const idx = i * 3;
        moteArray[idx + 1] -= moteSpeeds[i] * delta * 0.7; // slow descend
        moteArray[idx] += Math.sin(time * 0.5 + i) * delta * 0.25; // slow sway
        if (moteArray[idx + 1] < 15) {
          moteArray[idx + 1] = 80;
          moteArray[idx] = (Math.random() - 0.5) * 160;
          moteArray[idx + 2] = -180 + Math.random() * 120;

      }

    // Animation Loop
    
    // --- V1 ENHANCEMENT: Magic Runes & Floating Particles ---
    const v1_particlesGeo = new THREE.BufferGeometry();

    }
    v1_particlesGeo.setAttribute('position', new THREE.Float32BufferAttribute(v1_pos, 3));
    const v1_partMat = new THREE.PointsMaterial({map: mistTexture, color: 0xdacaa8, size: 0.10, transparent:true, opacity:0.28, depthWrite: false, blending: THREE.AdditiveBlending});
    const v1_particles = new THREE.Points(v1_particlesGeo, v1_partMat);
    scene.add(v1_particles);


    


    

function animate(now) {
      animationId = requestAnimationFrame(animate);
      if (now === undefined) now = performance.now();

      if (lastFrameTime) {
        const frameDurationMs = now - lastFrameTime;
        if (frameDurationMs > 30000 || document.visibilityState !== "visible") {
          fpsResetState();
        } else if (now > fpsWarmupEnd) {
          const currentFps = 1000 / frameDurationMs;
          fpsAccumulatedFrames++;
          fpsAccumulatedTime += frameDurationMs;
          if (currentFps < fpsMin) fpsMin = currentFps;
          if (currentFps > fpsMax) fpsMax = currentFps;
          fpsAvg = (fpsAccumulatedFrames * 1000) / fpsAccumulatedTime;
          if (now - lastFpsUpdateTime >= 250) {
            const domFpsElement = document.getElementById("fps-stats");
            if (domFpsElement) {
              domFpsElement.textContent = `CUR: ${formatFps(currentFps)} | MIN: ${formatFps(fpsMin)} | AVG: ${formatFps(fpsAvg)} | MAX: ${formatFps(fpsMax)}`;
            }
            lastFpsUpdateTime = now;
          }
        }
      }
      lastFrameTime = now;

      const frameDelta = Math.min(clock.getDelta(), 0.05);
      const delta = paused || document.hidden ? 0 : frameDelta * speedMultiplier * playbackSpeed;
      simulationTime += delta;
      const time = simulationTime;
      if (autoCamera) cameraTime += delta;

      if (!cameraInitialized || (autoCamera && delta > 0)) {
        // Camera dolly path loop (72 seconds at normal speed)
        const pathLoopTime = 72;
        const progress = (cameraTime / pathLoopTime) % 1.0;
        // Smooth speed changes linger on the bridge / guardian composition.
        const cinematicProgress = progress - Math.sin(progress * Math.PI * 2) * 0.065;
        const camBasePos = camPath.getPointAt(cinematicProgress);
  
        camera.position.copy(camBasePos);
  
        // Smooth camera look target drift
        cameraTarget.set(
          16 + Math.sin(cameraTime * 0.065) * 9,
          17 + Math.cos(cameraTime * 0.08) * 3,
          -60 + Math.sin(cameraTime * 0.06) * 5
        );
        // Middle storyboard beat reveals the guardian's grounded walk behind the bridge.
        sampleColossusRoute(time, gaitRoutePosition);
        gaitRoutePosition.y = guardianGroundY + 8;
        cameraTarget.lerp(gaitRoutePosition, Math.pow(Math.sin(progress * Math.PI), 4));
        if (!cameraInitialized) cameraTargetLag.copy(cameraTarget);
        cameraTargetLag.lerp(cameraTarget, 1 - Math.pow(0.015, delta));
  
        camera.lookAt(cameraTargetLag);

        cameraInitialized = true;
      }

      // Update shader uniforms
      if (grassMaterial.userData.shader) {
        grassMaterial.userData.shader.uniforms.time.value = time;
      }
      if (flowerMat.userData.shader) {
        flowerMat.userData.shader.uniforms.time.value = time;
      }
      if (birdMaterial.userData.shader) {
        birdMaterial.userData.shader.uniforms.time.value = time;
      }
      if (gradePass) {
        gradePass.uniforms.time.value = time;
      }

      waterfallTexture.offset.y = time * 0.32;
      mistLayers.forEach((layer, i) => {
        layer.position.x = layer.userData.baseX + Math.sin(time * 0.035 + i) * 7;
      });
      updateColossus(time);
      updateBirds(time);
      updateParticles(delta, time);

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
      if (composer) {
        composer.setSize(width, height);
        // Find FXAA Pass if active and update
        composer.passes.forEach((pass) => {
          if (pass.material && pass.material.uniforms.resolution) {
            pass.material.uniforms.resolution.value.set(
              1 / (width * renderer.getPixelRatio()),
              1 / (height * renderer.getPixelRatio())
            );
          }
        });
      }
    }

    window.addEventListener("resize", resize);
    animate();

    // Cleanup & Resource Disposal
    let disposed = false;
    function disposeMaterial(material) {
      if (!material) return;
      const materials = Array.isArray(material) ? material : [material];
      materials.forEach((mat) => {
        Object.keys(mat).forEach((key) => {
          const value = mat[key];
          if (value && value.isTexture) value.dispose();
        });
        mat.dispose();
      });
    }

    function disposeScene() {
      if (disposed) return;
      disposed = true;
      uiEvents.abort();
      
      // teardown cleanup
      document.removeEventListener("visibilitychange", onVisibilityChange);
      const fpsElem = document.getElementById("fps-stats");
      if (fpsElem) fpsElem.remove();
      
      window.removeEventListener("pagehide", disposeScene);
      window.removeEventListener("unload", disposeScene);
      cancelAnimationFrame(animationId);
      window.removeEventListener("resize", resize);
      
      scene.traverse((object) => {
        if (object.shadow) object.shadow.dispose();
        if (object.geometry) object.geometry.dispose();
        if (object.material) disposeMaterial(object.material);
      });
      
      if (composer) {
        composer.passes.forEach(pass => { if (pass.dispose) pass.dispose(); });
        composer.dispose();
      }
      renderer.dispose();
      if (renderer.domElement && renderer.domElement.parentNode) {
        renderer.domElement.parentNode.removeChild(renderer.domElement);
      }
    }

    window.addEventListener("pagehide", disposeScene);
    window.addEventListener("unload", disposeScene);
  </script>
</body>
</html>
