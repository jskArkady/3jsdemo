  <style>
@layer demo {
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111213;
      user-select: none;
    }
    #stage {
      position: fixed;
      inset: 0;
      background: #111213;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #fps-stats {
      position: fixed;
      top: 15px;
      right: 15px;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 4px;
      color: #00ff66;
      font-family: monospace;
      font-size: 11px;
      pointer-events: none;
      z-index: 99999;
      line-height: 1.2;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; --accent: #86d7d0; }
    .scene-header { position: fixed; top: 28px; left: 32px; color: #edf0ee; pointer-events: none; max-width: min(560px, calc(100vw - 64px)); text-shadow: 0 2px 10px #000; }
    .scene-header { isolation: isolate; }
    .scene-header::before { content: ""; position: absolute; inset: -10px -12px; z-index: -1; border-radius: 8px; background: linear-gradient(110deg, #0b1922df, #0b19228c); }
    .scene-header a { display: inline-block; margin-bottom: 22px; pointer-events: auto; color: var(--accent); text-decoration: none; font-size: 12px; }
    .eyebrow { font: 10px/1.8 ui-monospace, monospace; letter-spacing: .2em; color: var(--accent); }
    h1 { margin: 8px 0; font-size: clamp(23px, 3vw, 36px); font-weight: 450; letter-spacing: -.04em; }
    .scene-header p { margin: 0; font-size: 12px; line-height: 1.8; color: #d0dadb; }
    #fps-stats { top: 28px; right: 28px; color: #b8cecd; background: #101b22d9; font: 10px/1.8 ui-monospace, monospace; max-width: calc(100vw - 32px); z-index: 1; }
    .scene-footer { position: fixed; bottom: 24px; left: 32px; right: 32px; display: flex; justify-content: flex-end; pointer-events: none; }
    .controls { pointer-events: auto; padding: 14px 16px; border: 1px solid #a7bbbd44; background: #101b22e8; border-radius: 8px; backdrop-filter: blur(14px); color: #dfebe9; max-width: 100%; }
    .control-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    button, select { font: 12px system-ui; padding: 9px 12px; min-height: 38px; border: 1px solid #647d8266; border-radius: 4px; background: #1b2b33; color: #dfebe9; cursor: pointer; }
    button:hover, select:hover { border-color: var(--accent); }
    button[aria-pressed="true"] { background: #345052; border-color: var(--accent); }
    label { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #bccdcc; }
    input { width: 85px; accent-color: var(--accent); }
    output { min-width: 28px; font: 11px ui-monospace, monospace; }
    a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    #scene-status { margin: 10px 0 0; color: #b4c7c6; font-size: 11px; line-height: 1.6; }
    @media (max-width: 650px) {
      .scene-header { top: 18px; left: 20px; max-width: calc(100vw - 40px); }
      .scene-header a { margin-bottom: 36px; }
      .scene-header p { font-size: 11px; max-width: 290px; }
      #fps-stats { top: 48px; left: 20px; right: auto; font-size: 9px; padding: 4px 7px; }
      .scene-footer { left: 12px; right: 12px; bottom: 12px; }
      .controls { width: 100%; padding: 12px; }
      .control-row { gap: 8px; }
      button, select { padding: 8px; font-size: 11px; }
    }
    @media (max-height: 500px) {
      .scene-header { top: 10px; left: 18px; }
      .scene-header a { margin-bottom: 4px; }
      h1 { font-size: 21px; }
      .eyebrow, .scene-header p { display: none; }
      #fps-stats { top: 12px; left: auto; right: 12px; }
      .scene-footer { bottom: 10px; }
      .controls { padding: 9px; }
    }
  }
</style>

<body class="demo-ui demo-scene">
  <div id="stage"></div>
  <div id="fps-stats" aria-label="프레임 속도">FPS · 측정 준비 중</div>
  <header class="scene-header">
    <a href="../index.html">← 데모 갤러리</a>
    <div class="eyebrow">THREE.JS / CINEMATIC EXPLORATION</div>
    <h1>Ruined Portal Test Chamber</h1>
    <p>폐허 속 연결된 포털과 간헐적으로 깨어나는 기계 장치.</p>
  </header>
  <footer class="scene-footer">
    <section class="controls" aria-label="장면 조작">
      <div class="control-row">
        <button id="pause" type="button" aria-pressed="false">일시정지</button>
        <label for="speed">배속 <select id="speed"><option value="0.25">0.25×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
        <button id="auto" type="button" aria-pressed="true">자동 카메라 켜짐</button>
        <label for="exposure">노출 <input id="exposure" type="range" min="0.5" max="1.8" step="0.01" value="1.20"><output id="exposure-value" for="exposure">1.20</output></label>
      </div>
      <p id="scene-status" role="status" aria-live="polite"></p>
    </section>
  </footer>


  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { SSAOPass } from "three/addons/postprocessing/SSAOPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
    import { FXAAShader } from "three/addons/shaders/FXAAShader.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

    const container = document.getElementById("stage");

    // 1. RENDERER SETUP
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance",
      precision: "highp",
      alpha: false,
      stencil: false,
      depth: true,
      logarithmicDepthBuffer: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.0));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.20;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.localClippingEnabled = true;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111213);
    scene.fog = new THREE.FogExp2(0x111213, 0.022);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 150);

    const clock = new THREE.Clock();
    const cameraTarget = new THREE.Vector3(0, 0, 0);
    const cameraTargetLag = new THREE.Vector3(0, 0, 0);
    let animationId = 0;

    // COMMON CAMERA + FPS PASS

    // FPS Telemetry State
    let fpsWarmupEnd = performance.now() + 1000;
    let fpsMin = Infinity;
    let fpsMax = -Infinity;
    let fpsAvg = 0;
    let fpsAccumulatedFrames = 0;
    let fpsAccumulatedTime = 0;
    let lastFpsUpdateTime = 0;
    let lastFrameTime = 0;

    function fpsResetState() {
      fpsWarmupEnd = performance.now() + 1000;
      fpsMin = Infinity;
      fpsMax = -Infinity;
      fpsAvg = 0;
      fpsAccumulatedFrames = 0;
      fpsAccumulatedTime = 0;
      lastFpsUpdateTime = performance.now();
    }

    function formatFps(value) { return value < 10 ? value.toFixed(1) : String(Math.round(value)); }

    function onVisibilityChange() {
      if (document.visibilityState === "visible") {
        fpsResetState();
        clock.getDelta();
      }
    }
    document.addEventListener("visibilitychange", onVisibilityChange);

    // Reduced Motion Awareness
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const speedMultiplier = prefersReducedMotion ? 0.05 : 1.0;

    let paused = false;
    let playbackSpeed = 1;
    let autoCamera = !prefersReducedMotion;
    let simulationTime = 0;
    let cameraTime = 0;
    let cameraInitialized = false;
    const uiEvents = new AbortController();
    const pauseButton = document.getElementById("pause");
    const autoButton = document.getElementById("auto");
    function syncControls() {
      pauseButton.textContent = paused ? "재생" : "일시정지";
      pauseButton.setAttribute("aria-pressed", String(paused));
      autoButton.textContent = autoCamera ? "자동 카메라 켜짐" : "자동 카메라 꺼짐";
      autoButton.setAttribute("aria-pressed", String(autoCamera));
      document.getElementById("scene-status").textContent =
        `${paused ? "일시정지" : "재생 중"} · ${playbackSpeed}× · ${autoCamera ? "자동 카메라" : "카메라 고정"}${prefersReducedMotion ? " · 동작 줄이기 적용" : ""}`;
    }
    pauseButton.addEventListener("click", () => { paused = !paused; syncControls(); }, { signal: uiEvents.signal });
    autoButton.addEventListener("click", () => { autoCamera = !autoCamera; syncControls(); }, { signal: uiEvents.signal });
    document.getElementById("speed").addEventListener("change", (event) => {
      playbackSpeed = Number(event.target.value); syncControls();
    }, { signal: uiEvents.signal });
    document.getElementById("exposure").addEventListener("input", (event) => {
      renderer.toneMappingExposure = Number(event.target.value);
      document.getElementById("exposure-value").value = renderer.toneMappingExposure.toFixed(2);
    }, { signal: uiEvents.signal });
    syncControls();


    // 2. PROCEDURAL TEXTURE GENERATION
    // All material channels share the same pores, cracks and weathering coordinates.
    // Color is sRGB; height/roughness remain linear data textures.
    function createWeatheredMaps(kind) {
      const size = 512;
      const canvases = Array.from({length: 3}, () => Object.assign(document.createElement('canvas'), {width:size, height:size}));
      const contexts = canvases.map(c => c.getContext('2d'));
      const pixels = contexts.map(c => c.createImageData(size, size));
      const noise = (x,y) => { const n = Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); };
      const smoothNoise = (x, y) => {
        const ix = Math.floor(x), iy = Math.floor(y);
        const fx = x - ix, fy = y - iy;
        const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
        return THREE.MathUtils.lerp(
          THREE.MathUtils.lerp(noise(ix, iy), noise(ix + 1, iy), sx),
          THREE.MathUtils.lerp(noise(ix, iy + 1), noise(ix + 1, iy + 1), sx), sy);
      };
      for(let y=0;y<size;y++) for(let x=0;x<size;x++) {
        const u=x/size, v=y/size, n=noise(x,y);
        // Broad stains, chipped glaze and fine grains have separate scales.
        const cloud = smoothNoise(u * 5, v * 5) * 0.57
          + smoothNoise(u * 13 + 8, v * 13) * 0.28
          + smoothNoise(u * 37, v * 37 + 9) * 0.15;
        const crack = Math.abs(u-0.54-0.16*Math.sin(v*8)-0.015*Math.sin(v*110)) < 0.0028;
        const edge = Math.min(u,v,1-u,1-v);
        const dirt = Math.max(0,1-edge*17)*0.45 + cloud*0.18;
        const pore = n > 0.986 ? 0.12 : 0;
        let rgb, height, rough;
        if(kind==='ceramic') {
          const shade = 0.98 - dirt * 0.78 - pore * 0.3 - (crack ? 0.32 : 0);
          rgb = [214 * shade, 220 * shade, 210 * shade];
          height = 0.63 - pore * 0.2 - (crack ? 0.08 : 0) - dirt * 0.015;
          rough = 0.30 + dirt * 1.2 + pore;
        } else if(kind==='rust') {
          const oxide=cloud>0.4;
          rgb=oxide?[95+cloud*55,44+cloud*26,22+cloud*15]:[48+n*24,55+n*22,56+n*20];
          height=0.35+cloud*0.35+n*0.1; rough=oxide?0.94:0.46;
        } else {
          const shade=0.61+cloud*0.2+n*0.12-pore-(crack?0.23:0);
          rgb=[153*shade,157*shade,148*shade]; height=0.45+n*0.12-pore-(crack?0.2:0); rough=0.83+pore*0.3;
        }
        const i=(y*size+x)*4;
        for(let c=0;c<3;c++) { pixels[0].data[i+c]=rgb[c]; pixels[1].data[i+c]=Math.min(1,rough)*255; pixels[2].data[i+c]=Math.max(0,height)*255; }
        pixels.forEach(p=>p.data[i+3]=255);
      }
      return canvases.map((canvas,i)=>{
        contexts[i].putImageData(pixels[i],0,0);
        const texture=new THREE.CanvasTexture(canvas);
        texture.wrapS=texture.wrapT=THREE.RepeatWrapping;
        texture.colorSpace=i===0?THREE.SRGBColorSpace:THREE.NoColorSpace;
        return texture;
      });
    }

    // OBJECT + QUALITY ENHANCEMENT
    const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();
    const targetAnisotropy = Math.min(maxAnisotropy, 12);

    // 3. MATERIALS SETUP
    const [ceramicColorTex, ceramicRoughnessTex, ceramicBumpTex] = createWeatheredMaps("ceramic");
    [ceramicColorTex, ceramicRoughnessTex, ceramicBumpTex].forEach(t => t.anisotropy = targetAnisotropy);

    const ceramicMat = new THREE.MeshPhysicalMaterial({
      map: ceramicColorTex,
      roughnessMap: ceramicRoughnessTex,
      bumpMap: ceramicBumpTex,
      bumpScale: 0.02,
      roughness: 0.95,
      metalness: 0.02,
      clearcoat: 0.28,
      clearcoatRoughness: 0.24
    });

    const [concreteColorTex, concreteRoughnessTex, concreteBumpTex] = createWeatheredMaps("concrete");
    concreteColorTex.anisotropy = targetAnisotropy;
    const concreteMat = new THREE.MeshStandardMaterial({
      map: concreteColorTex,
      bumpMap: concreteBumpTex,
      roughnessMap: concreteRoughnessTex,
      bumpScale: 0.015,
      roughness: 0.82,
      metalness: 0.05
    });

    const [rustColorTex, rustRoughnessTex, rustBumpTex] = createWeatheredMaps("rust");
    [rustColorTex, rustRoughnessTex].forEach(t => t.anisotropy = targetAnisotropy);
    const rustMat = new THREE.MeshStandardMaterial({
      map: rustColorTex,
      bumpMap: rustBumpTex,
      bumpScale: 0.03,
      roughnessMap: rustRoughnessTex,
      roughness: 0.9,
      metalness: 0.15
    });

    // Thin rails can cover less than one pixel. Their screen-space derivatives
    // collapse at grazing angles, producing a zero bump normal in r183. Keep
    // the geometric normal there so NaNs cannot spread through the HDR bloom.
    rustMat.onBeforeCompile = (shader) => {
      const safeBump = THREE.ShaderChunk.bumpmap_pars_fragment
        .replace(
          "vec3 vSigmaX = normalize( dFdx( surf_pos.xyz ) );",
          `vec3 surfaceDx = dFdx( surf_pos.xyz );
           vec3 surfaceDy = dFdy( surf_pos.xyz );
           if (dot(surfaceDx, surfaceDx) < 1e-12 || dot(surfaceDy, surfaceDy) < 1e-12) return surf_norm;
           vec3 vSigmaX = normalize(surfaceDx);`
        )
        .replace("vec3 vSigmaY = normalize( dFdy( surf_pos.xyz ) );", "vec3 vSigmaY = normalize(surfaceDy);")
        .replace(
          "return normalize( abs( fDet ) * surf_norm - vGrad );",
          `vec3 bumpedNormal = abs(fDet) * surf_norm - vGrad;
           float normalLengthSquared = dot(bumpedNormal, bumpedNormal);
           return normalLengthSquared > 1e-12 ? bumpedNormal * inversesqrt(normalLengthSquared) : surf_norm;`
        );
      shader.fragmentShader = shader.fragmentShader.replace("#include <bumpmap_pars_fragment>", safeBump);
    };

    const darkMetalMat = new THREE.MeshStandardMaterial({
      color: 0x1f2122,
      roughness: 0.55,
      metalness: 0.8
    });

    const goldMat = new THREE.MeshStandardMaterial({
      color: 0xe8bc53,
      roughness: 0.16,
      metalness: 1.0
    });

    const cubeFaceMat = new THREE.MeshStandardMaterial({
      color: 0xe0e0da,
      roughness: 0.28,
      metalness: 0.12
    });

    const cubeGlowMat = new THREE.MeshBasicMaterial({
      color: 0x00bbff,
      toneMapped: false
    });

    const leafCanvas=Object.assign(document.createElement('canvas'),{width:128,height:192});
    const leafContext=leafCanvas.getContext('2d');
    const leafGradient=leafContext.createLinearGradient(15,0,105,192);
    leafGradient.addColorStop(0,'#9ea45b');leafGradient.addColorStop(0.5,'#617337');leafGradient.addColorStop(1,'#253e24');
    leafContext.fillStyle=leafGradient;leafContext.beginPath();leafContext.moveTo(64,5);
    leafContext.bezierCurveTo(118,50,120,110,64,187);leafContext.bezierCurveTo(8,110,10,50,64,5);leafContext.fill();
    leafContext.strokeStyle='rgba(192,193,121,.55)';leafContext.lineWidth=2;leafContext.beginPath();leafContext.moveTo(64,8);leafContext.lineTo(64,183);leafContext.stroke();
    leafContext.lineWidth=1;
    for(let y=38;y<160;y+=19){leafContext.beginPath();leafContext.moveTo(64,y+17);leafContext.lineTo(31,y-5);leafContext.moveTo(64,y+17);leafContext.lineTo(97,y-5);leafContext.stroke();}
    const leafTexture=new THREE.CanvasTexture(leafCanvas);leafTexture.colorSpace=THREE.SRGBColorSpace;
    const leafMat = new THREE.MeshStandardMaterial({
      map:leafTexture, color:0xabbf8c, alphaTest:0.45,
      roughness:0.84, side:THREE.DoubleSide
    });
    
    // Wind-sway injection for foliage
    leafMat.onBeforeCompile = (shader) => {
      shader.uniforms.time = { value: 0 };
      shader.vertexShader = shader.vertexShader.replace(
        "#include <common>",
        `
        #include <common>
        uniform float time;
        `
      );
      shader.vertexShader = shader.vertexShader.replace(
        "#include <begin_vertex>",
        `
        #include <begin_vertex>
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        float sway = sin(time * 2.2 + worldPos.x * 0.4 + worldPos.y * 0.8) * 0.07;
        transformed.x += sway * (1.0 - uv.y);
        transformed.z += sway * 0.5 * (1.0 - uv.y);
        `
      );
      leafMat.userData.shader = shader;
    };

    // 4. ENVIRONMENT CHAMBER GENERATION
    const halfX = 12;
    const halfY = 7;
    const halfZ = 16;

    // Dark Outer Cavity Box
    const outerBoxGeo = new THREE.BoxGeometry(26, 16, 34);
    const outerBoxMat = new THREE.MeshStandardMaterial({
      color: 0x141516,
      roughness: 0.92,
      metalness: 0.05,
      side: THREE.BackSide
    });
    const outerBox = new THREE.Mesh(outerBoxGeo, outerBoxMat);
    outerBox.position.set(0, 3, 0);
    outerBox.receiveShadow = true;
    scene.add(outerBox);

    // Instanced White Ceramic Panels
    const panelGeo = new RoundedBoxGeometry(1.95, 1.95, 0.12, 3, 0.02);
    const panelInstancedMesh = new THREE.InstancedMesh(panelGeo, ceramicMat, 1700);
    const panelBackingGeo = new THREE.BoxGeometry(1.99, 1.99, 0.06);
    const panelBackingInstancedMesh = new THREE.InstancedMesh(panelBackingGeo, darkMetalMat, 1700);
    let instanceIdx = 0;
    function addPanelInstance(matrix) {
      // Break up repeated tile color without extra materials or draw calls.
      const panelTone = 0.84 + 0.16 * ((Math.sin(matrix.elements[12] * 17.13
        + matrix.elements[13] * 9.7 + matrix.elements[14] * 31.17) + 1) * 0.5);
      panelInstancedMesh.setColorAt(instanceIdx, new THREE.Color(panelTone, panelTone, panelTone * 0.98));
      panelInstancedMesh.setMatrixAt(instanceIdx, matrix);
      const backingMatrix = matrix.clone().multiply(new THREE.Matrix4().makeTranslation(0, 0, -0.07));
      panelBackingInstancedMesh.setMatrixAt(instanceIdx, backingMatrix);
      instanceIdx++;
    }
    const tempMatrix = new THREE.Matrix4();
    const tempPos = new THREE.Vector3();
    const tempRot = new THREE.Euler();
    const tempQuat = new THREE.Quaternion();
    const tempScale = new THREE.Vector3(1, 1, 1);
    const dummy = new THREE.Object3D();

    // Deterministic random generator for visual layout
    let randSeed = 42;
    function deterministicRand() {
      const x = Math.sin(randSeed++) * 10000;
      return x - Math.floor(x);
    }

    // A. Floor Panels (Y = -4)
    for (let x = -halfX; x < halfX; x += 2) {
      for (let z = -halfZ; z < halfZ; z += 2) {
        const px = x + 1.0;
        const pz = z + 1.0;
        const py = -4.0;
        const randVal = deterministicRand();
        
        if (randVal < 0.12) continue; // panel completely missing
        
        tempPos.set(px, py, pz);
        tempRot.set(-Math.PI / 2, 0, 0);
        
        if (randVal < 0.32) { // damaged panel
          tempPos.y += deterministicRand() * 0.12;
          tempRot.set(
            -Math.PI / 2 + (deterministicRand() - 0.5) * 0.12,
            (deterministicRand() - 0.5) * 0.12,
            (deterministicRand() - 0.5) * 0.12
          );
        }
        tempQuat.setFromEuler(tempRot);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        addPanelInstance(tempMatrix);
      }
    }

    // B. Left Wall Panels (X = -12) - omitting portal location
    for (let y = -4; y < 10; y += 2) {
      for (let z = -halfZ; z < halfZ; z += 2) {
        const px = -12.0;
        const py = y + 1.0;
        const pz = z + 1.0;
        
        // Portal A sits at ~ Y=0, Z=4 on the left wall, omit panels here
        if (py >= -2 && py <= 2 && pz >= 2 && pz <= 6) continue;
        
        const randVal = deterministicRand();
        if (randVal < 0.18) continue;
        
        tempPos.set(px, py, pz);
        tempRot.set(0, Math.PI / 2, 0);
        
        if (randVal < 0.36) {
          tempPos.x += deterministicRand() * 0.22;
          tempRot.y += (deterministicRand() - 0.5) * 0.15;
          tempRot.x += (deterministicRand() - 0.5) * 0.12;
        }
        tempQuat.setFromEuler(tempRot);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        addPanelInstance(tempMatrix);
      }
    }

    // C. Right Wall Panels (X = 12)
    for (let y = -4; y < 10; y += 2) {
      for (let z = -halfZ; z < halfZ; z += 2) {

          gl_Position = projectionMatrix * mvPosition;

      fragmentShader: `
        uniform sampler2D tPortal;
        uniform vec3 tintColor;
        uniform float time;
        varying vec2 vUv;
        varying vec4 vScreenPos;

        float hash2(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float noise2(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash2(i + vec2(0.0,0.0)), hash2(i + vec2(1.0,0.0)), u.x),
                     mix(hash2(i + vec2(0.0,1.0)), hash2(i + vec2(1.0,1.0)), u.x), u.y);
        }

        void main() {
          vec2 screenUv = (vScreenPos.xy / vScreenPos.w) * 0.5 + 0.5;
          
          // Subtle shimmer waves
          float n = noise2(screenUv * 9.0 + vec2(time * 0.6, -time * 0.4));

          );
          
          screenUv += distortion;
          vec4 sceneColor = texture2D(tPortal, screenUv);
          
          float distFromCenter = length(vUv - vec2(0.5)) * 2.0;
          float edgeGlow = pow(clamp(distFromCenter, 0.0, 1.0), 3.2);
          
          vec3 finalColor = mix(sceneColor.rgb, tintColor, edgeGlow * 0.32);
          
          float shimmer = sin(distFromCenter * 16.0 - time * 3.5) * 0.5 + 0.5;
          finalColor += tintColor * shimmer * edgeGlow * 0.16;
          
          // Clamp portal surface output to avoid bloom spill
          gl_FragColor = vec4(clamp(finalColor, 0.0, 0.76), 1.0);
        }

    const floodMaterial = new THREE.ShaderMaterial({

      uniforms:{time:waterTime, centerA:{value:portalReflections[0].center}, normalA:{value:portalReflections[0].normal}, rightA:{value:portalReflections[0].right}, upA:{value:portalReflections[0].up}, centerB:{value:portalReflections[1].center}, normalB:{value:portalReflections[1].normal}, rightB:{value:portalReflections[1].right}, upB:{value:portalReflections[1].up}},
      vertexShader:`varying vec3 world; varying vec2 waterUv;
        void main(){waterUv=uv; world=(modelMatrix*vec4(position,1.)).xyz; gl_Position=projectionMatrix*viewMatrix*vec4(world,1.);}`,
      fragmentShader:`uniform float time; varying vec3 world; varying vec2 waterUv;
        uniform vec3 centerA,normalA,rightA,upA,centerB,normalB,rightB,upB;
        float ring(vec3 ray, vec3 center, vec3 normal, vec3 right, vec3 up){

          float t=dot(center-world,normal)/denom; if(t<0.)return 0.;
          vec3 hit=world+ray*t-center;
          float r=length(vec2(dot(hit,right)/0.675,dot(hit,up)/1.175));
          float distanceToRing = (r - 1.) * 16.;

        void main(){
          vec2 p=world.xz;

          vec3 incident=normalize(world-cameraPosition);

    for(let i=0; i<600; i++) {
        const group=i%2===0?portalGroupA:portalGroupB;
        v3_sparkPos.push(group.position.x+(Math.random()-0.5)*2.2,group.position.y+(Math.random()-0.5)*3,group.position.z+(Math.random()-0.5)*2.2);
    }
    v3_sparkGeo.setAttribute('position', new THREE.Float32BufferAttribute(v3_sparkPos, 3));
    const v3_sparkMat = new THREE.PointsMaterial({map: dustTexture, color: 0x83b9b9, size: 0.026, transparent:true, depthWrite:false, opacity:0.35, blending: THREE.AdditiveBlending});
    const v3_sparks = new THREE.Points(v3_sparkGeo, v3_sparkMat);
    scene.add(v3_sparks);


    


    

function animate(now) {
      animationId = requestAnimationFrame(animate);
      if (now === undefined) now = performance.now();

      if (lastFrameTime) {
        const frameDurationMs = now - lastFrameTime;
        if (frameDurationMs > 30000 || document.visibilityState !== "visible") {
          fpsResetState();
        } else if (now > fpsWarmupEnd) {
          const currentFps = 1000 / frameDurationMs;
          fpsAccumulatedFrames++;
          fpsAccumulatedTime += frameDurationMs;
          if (currentFps < fpsMin) fpsMin = currentFps;
          if (currentFps > fpsMax) fpsMax = currentFps;
          fpsAvg = (fpsAccumulatedFrames * 1000) / fpsAccumulatedTime;
          if (now - lastFpsUpdateTime >= 250) {
            const domFpsElement = document.getElementById("fps-stats");
            if (domFpsElement) {
              domFpsElement.textContent = `CUR: ${formatFps(currentFps)} | MIN: ${formatFps(fpsMin)} | AVG: ${formatFps(fpsAvg)} | MAX: ${formatFps(fpsMax)}`;
            }
            lastFpsUpdateTime = now;
          }
        }
      }
      lastFrameTime = now;

      const frameDelta = Math.min(clock.getDelta(), 0.05);
      const delta = paused || document.hidden ? 0 : frameDelta * speedMultiplier * playbackSpeed;
      simulationTime += delta;
      const time = simulationTime;
      if (autoCamera) cameraTime += delta;

      if (!cameraInitialized || (autoCamera && delta > 0)) {
        // Camera Traversal
        const travelDuration = 40.0;
        const progress = (cameraTime / travelDuration) % 1.0;
  
        const camBase = camPath.getPointAt(progress);
        camera.position.copy(camBase);
  
        const targetBase = targetPath.getPointAt(progress);
        cameraTarget.copy(targetBase);
        
        if (!cameraInitialized) cameraTargetLag.copy(cameraTarget);
        cameraTargetLag.lerp(cameraTarget, 1 - Math.pow(0.015, delta));
  
        camera.lookAt(cameraTargetLag);
        camera.updateMatrixWorld();

        cameraInitialized = true;
      }

      // Shaders time update
      if (leafMat.userData.shader) {
        leafMat.userData.shader.uniforms.time.value = time;
      }
      portalShaderA.uniforms.time.value = time;
      portalShaderB.uniforms.time.value = time;
      rimShaderMatA.uniforms.time.value = time;
      rimShaderMatB.uniforms.time.value = time;
      shaftMat.uniforms.time.value = time;
      if (gradePass) {
        gradePass.uniforms.time.value = time;
      }

      waterTime.value=time;
      const dustPositions=v3_sparkGeo.attributes.position.array;
      for(let i=0;i<600;i++){
        const group=i%2===0?portalGroupA:portalGroupB;
        const phase=i*2.39996+time*0.13;
        dustPositions[i*3]=group.position.x+Math.sin(phase)*(0.3+(i%11)*0.07);
        dustPositions[i*3+1]=group.position.y+Math.cos(phase*0.7)*1.5;
        dustPositions[i*3+2]=group.position.z+Math.cos(phase)*(0.3+(i%11)*0.07);
      }
      v3_sparkGeo.attributes.position.needsUpdate=true;
      const restartPhase=time%16;
      const restart=restartPhase>11 ? Math.sin((restartPhase-11)/5*Math.PI)**2 : 0;
      statusMaterials.forEach((mat,i)=>mat.color.setRGB(0.015,0.035,0.026).lerp(new THREE.Color(0.12,1.5,0.64), restartPhase>11+i*0.7 ? restart : 0));
      portalLights.forEach((light,i)=>light.intensity=(i===0?36:30)*(0.97+0.03*Math.sin(time*1.7+i)));
      // Hydraulic mechanical parts animation
      const strokeA = restart * 0.58 * Math.sin(time * 1.9);
      pistonRodA.position.x = 0.4 + strokeA;
      servoGroupA.position.x = 11.9 - strokeA * 0.82;
      servoGroupA.rotation.z = restart * Math.sin(time * 1.3) * 0.05;
      servoGroupA.rotation.y = restart * Math.cos(time * 1.25) * 0.04;

      const strokeB = 0;
      pistonRodB.position.y = 0.4 + strokeB;
      servoGroupB.position.y = 9.9 - strokeB * 0.82;
      servoGroupB.rotation.x = 0;
      servoGroupB.rotation.z = 0;

      // Dust drift A
      const pArrayA = particleGeoA.attributes.position.array;
      for (let i = 0; i < particleCountA; i++) {
        const idx = i * 3;
        pArrayA[idx + 1] -= particleSpeedsA[i] * delta;
        pArrayA[idx + 2] += particleDriftA[i] * delta;
        if (pArrayA[idx + 1] < -4.0) {
          pArrayA[idx + 1] = 10.0;
          pArrayA[idx] = (Math.random() - 0.5) * 23;
          pArrayA[idx + 2] = (Math.random() - 0.5) * 31;
        }
      }
      particleGeoA.attributes.position.needsUpdate = true;

      // Dust drift B
      const pArrayB = particleGeoB.attributes.position.array;
      for (let i = 0; i < particleCountB; i++) {
        const idx = i * 3;
        pArrayB[idx + 1] -= particleSpeedsB[i] * delta;
        pArrayB[idx + 2] += particleDriftB[i] * delta;
        if (pArrayB[idx + 1] < -4.0) {
          pArrayB[idx + 1] = 10.0;
          pArrayB[idx] = (Math.random() - 0.5) * 23;
          pArrayB[idx + 2] = (Math.random() - 0.5) * 31;
        }
      }
      particleGeoB.attributes.position.needsUpdate = true;

      // Virtual portal render pass
      renderPortalRenderTargets();

      // Main viewport render pass
      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    // 14. RESIZE & DISPOSAL
    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      
      renderer.setSize(width, height);
      if (composer) {
        composer.setSize(width, height);
        composer.passes.forEach((pass) => {
          if (pass.material && pass.material.uniforms.resolution) {
            pass.material.uniforms.resolution.value.set(
              1 / (width * renderer.getPixelRatio()),
              1 / (height * renderer.getPixelRatio())
            );
          }
        });
      }
    }

    window.addEventListener("resize", resize);
    animate();

    let disposed = false;
    function disposeMaterial(material) {
      if (!material) return;
      const materials = Array.isArray(material) ? material : [material];
      materials.forEach((mat) => {
        Object.keys(mat).forEach((key) => {
          const val = mat[key];
          if (val && val.isTexture) val.dispose();
        });
        mat.dispose();
      });
    }

    function disposeScene() {
      if (disposed) return;
      disposed = true;
      uiEvents.abort();

      // teardown cleanup
      document.removeEventListener("visibilitychange", onVisibilityChange);
      const fpsElem = document.getElementById("fps-stats");
      if (fpsElem) fpsElem.remove();

      window.removeEventListener("pagehide", disposeScene);
      window.removeEventListener("unload", disposeScene);
      window.removeEventListener("resize", resize);
      cancelAnimationFrame(animationId);

      scene.traverse((obj) => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) disposeMaterial(obj.material);
      });

      renderTargetA.dispose();
      renderTargetB.dispose();

      if (composer) { composer.passes.forEach(pass=>pass.dispose?.()); composer.dispose(); }
      renderer.dispose();
      
      if (renderer.domElement && renderer.domElement.parentNode) {
        renderer.domElement.parentNode.removeChild(renderer.domElement);
      }
    }

    window.addEventListener("pagehide", disposeScene);
    window.addEventListener("unload", disposeScene);
  </script>
</body>
