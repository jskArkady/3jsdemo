function resize(){renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));renderer.setSize(innerWidth,innerHeight);composer.setPixelRatio(renderer.getPixelRatio());composer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();pose();camera.position.copy(desiredCamera);target.copy(desiredTarget);}
listen(window,'resize',resize);listen(document,'visibilitychange',()=>{last=0;fpsTime=0;fpsFrames=0;});
const motion=matchMedia('(prefers-reduced-motion: reduce)');listen(motion,'change',()=>{if(motion.matches){auto=false;syncUI();}});
listen(renderer.domElement,'webglcontextlost',event=>{event.preventDefault();errorBox.hidden=false;errorBox.textContent='그래픽 컨텍스트가 중단되었습니다. 페이지를 새로고침해 천문대를 다시 열어 주세요.';dispose();});
function dispose(){if(disposed)return;disposed=true;cancelAnimationFrame(animationId);controller.abort();scene.traverse(o=>{if(o.isInstancedMesh)o.dispose();});geometries.forEach(g=>g.dispose());materials.forEach(m=>m.dispose());textures.forEach(t=>t.dispose());environment.dispose();composer.passes.forEach(p=>p.dispose?.());composer.dispose();renderer.dispose();}
// BFCache keeps the page and its GPU resources alive; only reset the time origin on return.
listen(window,'pagehide',event=>{if(event.persisted){cancelAnimationFrame(animationId);last=0;}else dispose();});listen(window,'pageshow',event=>{if(event.persisted&&!disposed){last=0;animationId=requestAnimationFrame(animate);}});
syncUI();pose();camera.position.copy(desiredCamera);target.copy(desiredTarget);camera.lookAt(target);animationId=requestAnimationFrame(animate);
} catch(error){console.error(error);errorBox.hidden=false;errorBox.textContent='천문대를 시작하지 못했습니다. WebGL 지원과 인터넷 연결(Three.js CDN)을 확인한 뒤 새로고침해 주세요.';}
